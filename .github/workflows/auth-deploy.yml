name: Auth Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  names:
    runs-on: ubuntu-latest
    outputs:
      secret-names: ${{ steps.names.outputs.value }}
    steps:
      - name: Expand the names passed to the worker
        id: names
        env:
          NAMES: |
            APP_ENV
            ACCOUNTS_URL
            API_URL
            APP_URL
            AUTH_API_URL
            TRUSTED_ORIGINS
            TURNSTILE_SITE_KEY
        run: |
          {
            echo 'value<<NAMES'
            echo "$NAMES"
            echo 'NAMES'
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: names
    if: github.ref_name == 'main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/WorkersDeploy@v2.0.1
        with:
          mode: production
          worker-name: auth-karasu256-com
          secret-names: ${{ needs.names.outputs.secret-names }}
          vars-json: ${{ toJSON(vars) }}

  preview:
    needs: names
    if: github.ref_name != 'main'
    environment: preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: dev
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/WorkersDeploy@v2.0.1
        with:
          mode: production
          worker-name: dev-auth-karasu256-com
          secret-names: ${{ needs.names.outputs.secret-names }}
          vars-json: ${{ toJSON(vars) }}
